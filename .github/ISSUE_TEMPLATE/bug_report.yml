name: Bug report
description: A component, a skeleton, a chart drawing, a check script or the install did something wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A screenshot or a short recording helps most, at the width where it goes wrong.
  - type: dropdown
    id: skill
    attributes:
      label: Which skill or package?
      options:
        - boilerplate
        - skeleton
        - "@frontendsupply/chart-skeletons"
        - Installing
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent?
      options:
        - Claude Code
        - Codex
        - Cursor
        - OpenCode
        - Other
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Your stack
      description: React, Tailwind and Base UI versions, framework, package manager.
      placeholder: React 19.3, Tailwind 4.3, Base UI 1.9, Next.js 16, pnpm
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you got, and what you expected.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: The check's output
      description: "`node <skill folder>/scripts/check.mjs <file>` (or check-drawing.mjs), if it applies."
      render: text
